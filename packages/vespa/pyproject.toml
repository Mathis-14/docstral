[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docstral-vespa"
version = "0.1.0"
description = "Shared Vespa application definition for Docstral"
requires-python = ">=3.13,<3.15"
dependencies = [
    "mistralai-search-toolkit==0.0.13",
    "mistralai-search-toolkit-plugins-vespa==0.0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docstral_vespa"]
