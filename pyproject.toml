[project]
name = "docstral"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pyyaml",
    "ruff",
]
eval = [
    "openai==2.54.0",
    "ragas==0.4.3",
    "rich==14.3.4",
]

[tool.uv]
package = false
# Ragas 0.4.3 imports ChatVertexAI, removed in langchain-community 0.4.2.
constraint-dependencies = ["langchain-community==0.4.1"]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["F", "I", "ANN", "B", "UP", "TID", "RUF"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
files = [
    "deployment/tests",
    "apps/backend/src",
    "apps/backend/tests",
    "apps/mcp/src",
    "apps/mcp/tests",
    "apps/worker/src",
    "apps/worker/tests",
    "packages/vespa/src",
    "packages/vespa/tests",
]

[tool.pytest.ini_options]
testpaths = ["apps", "packages", "deployment/tests"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
markers = ["integration: requires external services"]

[tool.pydantic-mypy]
init_typed = true
