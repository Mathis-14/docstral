apiVersion: v1
kind: Service
metadata:
  name: vespa
spec:
  clusterIP: None
  # Bootstrap must reach the config server before the first schema is deployed.
  publishNotReadyAddresses: true
  selector:
    app: vespa
  ports:
    - name: query
      port: 8080
    - name: config
      port: 19071
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vespa
spec:
  serviceName: vespa
  replicas: 1
  selector:
    matchLabels:
      app: vespa
  template:
    metadata:
      labels:
        app: vespa
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: volume-owner
          image: vespaengine/vespa@sha256:d17fa1064cd1a470e9cbdf7136bd66b49716abe09179b82ee120427a4d22b426
          command: [sh, -ec]
          args:
            - mkdir -p /storage/var /storage/logs; chown 1000:1000 /storage/var /storage/logs
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - name: storage
              mountPath: /storage
      containers:
        - name: vespa
          image: vespaengine/vespa@sha256:d17fa1064cd1a470e9cbdf7136bd66b49716abe09179b82ee120427a4d22b426
          env:
            - name: VESPA_HOSTNAME
              value: vespa-0.vespa.docstral.svc.cluster.local
            - name: VESPA_CONFIGSERVERS
              value: vespa-0.vespa.docstral.svc.cluster.local
            - {name: VESPA_LOG_STDOUT, value: "true"}
          ports:
            - {name: query, containerPort: 8080}
            - {name: config, containerPort: 19071}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: "2", memory: 6Gi}
            limits: {memory: 8Gi}
          startupProbe:
            httpGet: {path: /state/v1/health, port: config}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /ApplicationStatus, port: query}
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - {name: storage, mountPath: /opt/vespa/var, subPath: var}
            - {name: storage, mountPath: /opt/vespa/logs, subPath: logs}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 20Gi
