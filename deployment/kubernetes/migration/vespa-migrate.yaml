apiVersion: batch/v1
kind: Job
metadata:
  name: vespa-migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: vespa-migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: docstral-worker:release
          command: [sh, -ec]
          args:
            - |
              app_dir=$(python -c 'from pathlib import Path; import docstral_vespa; print(Path(docstral_vespa.__file__).parent)')
              exec mistral-vespa migrate --app-dir "$app_dir" --config-server http://vespa-0.vespa.docstral.svc.cluster.local:19071
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
