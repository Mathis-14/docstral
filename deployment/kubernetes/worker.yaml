apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worker-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  # The deployment workflow starts the worker only after migration succeeds.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: docstral-worker:release
          args: [workflows]
          env:
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef: {name: mistral, key: MISTRAL_API_KEY}
            - {name: DOCSTRAL_DATA_DIR, value: /app/data}
            - {name: VESPA_ENDPOINT, value: "http://vespa:8080"}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - {name: MCP_DEPLOYMENT, value: mcp}
            - name: DEPLOYMENT_NAME
              valueFrom:
                configMapKeyRef: {name: runtime, key: DEPLOYMENT_NAME}
            - {name: HEALTH_SERVER_HOST, value: "0.0.0.0"}
            - {name: HEALTH_SERVER_PORT, value: "8081"}
          ports:
            - {name: health, containerPort: 8081}
          startupProbe:
            httpGet: {path: /health, port: health}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: health}
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {memory: 3Gi}
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: worker-data
