[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docstral-ingestion"
version = "0.1.0"
description = "Documentation ingestion for Docstral"
requires-python = ">=3.13,<3.15"
dependencies = [
    "beautifulsoup4",
    "httpx",
    "mistralai-search-toolkit[html-converter-markdownify]==0.0.13",
    "protego",
    "pydantic",
    "structlog",
]

[project.scripts]
docstral-ingestion = "docstral_ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docstral_ingestion"]
