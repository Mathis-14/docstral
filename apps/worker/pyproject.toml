[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docstral-worker"
version = "0.1.0"
description = "Documentation worker for Docstral"
requires-python = ">=3.13,<3.15"
dependencies = [
    "beautifulsoup4",
    "docstral-vespa",
    "httpx",
    "kubernetes==36.0.3",
    "mistralai-search-toolkit[html-converter-markdownify]==0.0.13",
    "mistralai-workflows==3.13.0",
    "protego",
    "pydantic",
    "structlog",
]

[tool.uv.sources]
docstral-vespa = { workspace = true }

[project.scripts]
docstral-worker = "docstral_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docstral_worker"]
